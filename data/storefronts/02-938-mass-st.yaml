blurb: "For a limited time, visit the <a href=\"https://lawrencepottersguild.com/\" target=\"_blank\">Lawrence Potters' Guild</a> at their OpenStudios location at 938 Massachusetts St, next to Red Lyon Tavern. Artists will have work on display and available for purchase, with more exciting events throughout October and early November. See ceramics, pottery, painting, and more at a space brought to artists and your community by OpenStudios Lawrence and the owners of Red Lyon Tavern."
artists:
  - name: "Belinda Baker"
    image: "/images/storefronts/lawrencePottersGuild/belinda-baker.jpg"
    bio: "<i>President, Lawrence Potters' Guild · OpenStudios Leadership Team</i><br>Belinda has been a member of Lawrence Potters' Guild since 2015 and is the current President. She is a multidisciplinary artist who continually finds her way back to clay. While she has explored painting, stained glass, jewelry, and fiber arts, pottery remains her lifelong passion. For years, Belinda's primary focus was creating beautiful, wheel-thrown pottery designed for everyday use. Recently, however, her work has evolved to include hand-built vessels and small-scale sculptures that bring a touch of whimsy to her ceramic practice."
  - name: "Jim Rome"
    image: "/images/storefronts/lawrencePottersGuild/jim-rome.jpg"
    bio: "<i>Vice President, Lawrence Potters' Guild · OpenStudios Leadership Team</i><br>Jim is a local potter. He makes simple form-driven pieces, almost exclusively thrown on the wheel. He sees his ceramic journey as a long road of aiming toward mastery. He also was the Kansas State Banjo Champion in 2007 and still remembers how to play it!"
  - name: "Janet Akers"
    image: "/images/storefronts/lawrencePottersGuild/janet-akers.jpg"
    bio: "<i>Treasurer, Lawrence Potters' Guild · OpenStudios Leadership Team</i><br>I find inspiration for my work when I am outside, whether it's walking in parks or driving across country. I work in clay and mixed-media. I find that working with a variety of materials provides a challenge for me and adds interest to the final piece. Most of my work is sculptural, often small enough to be held in the hand. I want my pieces to appeal not only to the viewer's sight, but to their sense of touch and hearing."
  - name: "Andrea Diaz Buezo"
    image: "/images/storefronts/lawrencePottersGuild/andrea-diaz-buezo.jpg"
    bio: "<i>Secretary, Lawrence Potters' Guild</i><br>Andrea began throwing clay about four years ago after taking an intro-to-pottery class in college. She loves learning new techniques and expanding her knowledge in all things pottery. You will notice that Nature is a central theme of her art. She shares that the natural world has always held a place in her heart, and her love and admiration for it have only grown throughout the years. When Andrea's outdoors, she feels like she can breathe and just be; the same way she feels when she makes art. So she paints Nature's work as an extension of the peace and joy it brings her and as a thank-you for saving her far more times than she can count."
  - name: "Ron Schmidt"
    image: "/images/storefronts/lawrencePottersGuild/ron-schmidt.jpg"
    bio: "<i>OpenStudios Leadership Team</i><br>Ron first started working with clay at the Lawrence Arts Center, upon his retirement from public school administration. His work is primarily hand built and slab built. He especially enjoys experimenting with glazes. When not working with clay, he enjoys traveling, so far 63 countries, and gardening. Ron has been married to Elaine for 58 years and has two daughters and 4 grandchildren."
  - name: "Ling-Lung Chen"
    image: "/images/storefronts/lawrencePottersGuild/ling-lung-chen.jpg"
    bio: "Ling-Lung Chen was born and raised in Taiwan, a subtropical island state with multi-cultural heritage. She does most of her ceramic work at the Lawrence Arts Center. Her work is deeply influenced by traditional Asian arts. Her functional wares are wheel thrown or hand built with slabs and coils. She enjoys exploring different forms and surfaces."
    links:
      - label: "Instagram"
        url: "https://www.instagram.com/llchen5/"
  - name: "Beth Cramer"
    image: "/images/storefronts/lawrencePottersGuild/beth-cramer.jpg"
    bio: "Beth began throwing clay nearly four years ago through classes at the Lawrence Arts Center. Now recently retired, she splits her time between her pottery studio and the outdoors. In the studio, she loves experimenting with new clays and glazes, with a current focus on stackable bowls, coffee cups, blues, and greens. Beth's goal is to create functional, beautiful pieces for the minimalist household. When she's away from the wheel, you'll find her bikepacking, backpacking, or visiting her kids in North Carolina and Idaho."
  - name: "Larry Brow"
    image: "/images/storefronts/lawrencePottersGuild/larry-brow.jpg"
    bio: "I have lived in Lawrence, off and on, since 1975, and took my first Ceramics class at Grinnell College in 1979. Videos can be seen on YouTube at PLEASE TOUCH POTTERY. Thank you for considering owning my work."
  - name: "Autumn Baker"
    image: "/images/storefronts/lawrencePottersGuild/autumn-baker.jpg"
    bio: "Autumn has been living in Lawrence, Kansas for over a decade, but she grew up in Fleming Island, Florida where she acquired her BFA at the University of North Florida with a focus in ceramics. Her love of art extends to many mediums and is always changing. But when working in clay, she is often drawn to organic shapes inspired by nature and history."
  - name: "Lauren Bass"
    image: "/images/storefronts/lawrencePottersGuild/lauren-bass.jpg"
    bio: "Lauren Bass is an artist based in Lawrence, Kansas. She graduated from the University of Kansas in 2022 with a B.A. in Film & Media Studies, Environmental Studies, and a minor in Visual Art. Through her work she explores the figural and temporal aspects of the natural world, utilizing vibrant color and texture to convey the heightening of sensory experience. Trees are a central focus of her artistic practice, with their relation to the human body and roles as scribes of time upon earth. Lauren has shown at the Albrecht-Kemper Museum of Art, the Edgar Heap of Birds Family Gallery, Jonas Gallery, Cider Gallery, and the Phoenix Gallery. She recently attended residencies at the Chautauqua Visual Arts Program in New York and Sable Arts Project in Vermont, where she began her current focus on trees."
