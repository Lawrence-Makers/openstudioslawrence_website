  - "Friday: 11:30am to 5:30pm"
  - "Saturday: 11:30am to 5:30pm"
  - "Sunday: 12pm to 3pm"
photo: "/images/storefronts/lawrencePottersGuild/storefront.jpg"
blurb: "For a limited time, visit the <a href=\"https://lawrencepottersguild.com/\" target=\"_blank\">Lawrence Potters' Guild</a> at their OpenStudios location at 938 Massachusetts St, next to <a href=\"https://www.facebook.com/RedLyonTavern/\" target=\"_blank\">Red Lyon Tavern</a>. Artists will have work on display and available for purchase, with more exciting events throughout October and early November. See ceramics, pottery, painting, and more at a space brought to artists and your community by OpenStudios Lawrence and the owners of Red Lyon Tavern."
artists:
  - name: "Belinda Baker"
    image: "/images/storefronts/lawrencePottersGuild/belinda-baker.jpg"
    imagePosition: "70%"
    bio: "<i>President, Lawrence Potters' Guild</i><br>Belinda is a multidisciplinary artist who always finds her way back to clay. Long known for wheel-thrown pottery for everyday use, she now also makes hand-built vessels and whimsical small sculptures."
  - name: "Jim Rome"
    image: "/images/storefronts/lawrencePottersGuild/jim-rome.jpg"
    imagePosition: "80%"
    bio: "<i>Vice President, Lawrence Potters' Guild</i><br>Jim is a local potter. He makes simple form-driven pieces, almost exclusively thrown on the wheel. He sees his ceramic journey as a long road of aiming toward mastery. He also was the Kansas State Banjo Champion in 2007 and still remembers how to play it!"
  - name: "Janet Akers"
    image: "/images/storefronts/lawrencePottersGuild/janet-akers.jpg"
    imagePosition: "30%"
    bio: "<i>Treasurer, Lawrence Potters' Guild</i><br>I find inspiration for my work when I am outside, whether it's walking in parks or driving across country. I work in clay and mixed-media. I find that working with a variety of materials provides a challenge for me and adds interest to the final piece. Most of my work is sculptural, often small enough to be held in the hand. I want my pieces to appeal not only to the viewer's sight, but to their sense of touch and hearing."
  - name: "Andrea Diaz Buezo"
    image: "/images/storefronts/lawrencePottersGuild/andrea-diaz-buezo.jpg"
    imagePosition: "30%"
    bio: "<i>Secretary, Lawrence Potters' Guild</i><br>Andrea began throwing clay about four years ago after an intro pottery class in college. Nature is the central theme of her work, which she paints as a thank-you for the peace and joy it brings her."
  - name: "Ron Schmidt"
    image: "/images/storefronts/lawrencePottersGuild/ron-schmidt.jpg"
    imagePosition: "80%"
    bio: "Ron first started working with clay at the Lawrence Arts Center, upon his retirement from public school administration. His work is primarily hand built and slab built. He especially enjoys experimenting with glazes. When not working with clay, he enjoys traveling, so far 63 countries, and gardening. Ron has been married to Elaine for 58 years and has two daughters and 4 grandchildren."
  - name: "Ling-Lung Chen"
    image: "/images/storefronts/lawrencePottersGuild/ling-lung-chen.jpg"
    imagePosition: "40%"
    bio: "Ling-Lung Chen was born and raised in Taiwan, a subtropical island state with multi-cultural heritage. She does most of her ceramic work at the Lawrence Arts Center. Her work is deeply influenced by traditional Asian arts. Her functional wares are wheel thrown or hand built with slabs and coils. She enjoys exploring different forms and surfaces."
    links:
      - label: "Instagram"
        url: "https://www.instagram.com/llchen5/"
  - name: "Beth Cramer"
    image: "/images/storefronts/lawrencePottersGuild/beth-cramer.jpg"
    imagePosition: "70%"
    bio: "Beth began throwing clay nearly four years ago at the Lawrence Arts Center. She makes functional, beautiful pieces for the minimalist household, currently stackable bowls and coffee cups in blues and greens."
  - name: "Larry Brow"
    image: "/images/storefronts/lawrencePottersGuild/larry-brow.jpg"
    imagePosition: "40%"
    bio: "I have lived in Lawrence, off and on, since 1975, and took my first Ceramics class at Grinnell College in 1979. Videos can be seen on YouTube at PLEASE TOUCH POTTERY. Thank you for considering owning my work."
  - name: "Autumn Baker"
    image: "/images/storefronts/lawrencePottersGuild/autumn-baker.jpg"
    imagePosition: "50%"
    bio: "Autumn has been living in Lawrence, Kansas for over a decade, but she grew up in Fleming Island, Florida where she acquired her BFA at the University of North Florida with a focus in ceramics. Her love of art extends to many mediums and is always changing. But when working in clay, she is often drawn to organic shapes inspired by nature and history."
  - name: "Lauren Bass"
    image: "/images/storefronts/lawrencePottersGuild/lauren-bass.jpg"
    imagePosition: "50%"
    bio: "Lauren graduated from KU in 2022 with a B.A. in Film & Media Studies and Environmental Studies and a minor in Visual Art. Using vibrant color and texture, she explores the natural world, with a central focus on trees."
    links:
      - label: "Website"
        emoji: "🌐"
        url: "https://basslauren.myportfolio.com/painting"
      - label: "Instagram"
        url: "https://www.instagram.com/laurenbass_art/"
