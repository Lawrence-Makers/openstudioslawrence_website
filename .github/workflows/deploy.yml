# Build the site with Hugo and publish it to Cloudflare Pages.
#   push to master -> openstudioslawrence.org (production)
#   push to dev    -> dev preview (dev.openstudioslawrence.pages.dev)
# If the Hugo build fails, nothing is deployed and the error shows on the commit.
name: Build and deploy

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: 0.154.5
  CLOUDFLARE_ACCOUNT_ID: 82e4a830e2f60ea7ea262ef91ec42bf9
  PAGES_PROJECT: openstudioslawrence

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo (including the theme)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build the site
        run: |
          set -o pipefail
          if hugo 2>&1 | tee "$RUNNER_TEMP/hugo.log"; then exit 0; fi
          # Hugo failed: surface its error on the run page and on the offending file
          msg=$(grep -m1 'ERROR' "$RUNNER_TEMP/hugo.log" | sed -e 's/^.*ERROR //' -e "s#${GITHUB_WORKSPACE}/##g")
          loc=$(grep -m1 -oE "\"${GITHUB_WORKSPACE}/[^\"]+:[0-9]+(:[0-9]+)?\"" "$RUNNER_TEMP/hugo.log" | tr -d '"' | sed "s#${GITHUB_WORKSPACE}/##")
          file=$(echo "$loc" | cut -d: -f1); line=$(echo "$loc" | cut -d: -f2)
          if [ -n "$file" ]; then
            echo "::error file=${file},line=${line},title=Site not published: error in ${file} line ${line}::${msg}"
          else
            echo "::error title=Site not published: Hugo build failed::${msg}"
          fi
          {
            echo "## ❌ Site not published"
            echo
            echo "Hugo couldn't build the site, so **nothing was deployed** and the website is unchanged."
            echo
            [ -n "$file" ] && echo "**File:** \`${file}\` **line ${line}**" && echo
            echo '```'
            echo "$msg"
            echo '```'
            echo
            echo "Fix the file and commit again; the site will publish automatically once the build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name="$PAGES_PROJECT" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="$(git log -1 --pretty=%s | head -c 300)"
